services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
	environment:
      - PUID=&{PUID}
	  - PGID=${PGID}
	  - TZ=${TZ}
	volumes:
	  - /docker/appdata/config/jellyfin:/config
	  - /docker/appdata/cache/jellyfin:/cache
	  - /path/to/media:/data:ro
	ports:
	  - '127.0.0.1:8096:8096'
	restart: unless-stopped

  sonarr:
	image: ghcr.io/hotio/sonarr:latest
	container_name: sonarr
	environment:
	  - PUID=${PUID}
	  - PGID=&{PGID}
	  - TZ=${TZ}
	volumes:
	  - /etc/localtime:/etc/localtime:ro
	  - /docker/appdata/config/sonarr:/config
	  - /path/to/data:/data
	ports:
	  - '127.0.0.1:8989:8989'
	restart: unless-stopped

  radarr:
	image: ghcr.io/hotio/radarr:latest
	container_name: radarr
	environment:
	  - PUID=${PUID}
	  - PGID=${PGID}
	  - TZ=${TZ}
	volumes:
	  - /etc/localtime:/etc/localtime:ro
	  - /docker/appdata/config/radarr:/config
	  - /path/to/data:/data
	ports:
	  - '127.0.0.1:7878:7878'
	restart: unless-stopped

  bazarr:
	image: ghcr.io/hotio/bazarr:latest
	contaimer_name: bazarr
	environment:
	  - PUID=${PUID}
	  - PGID=${PGID}
	  - TZ=${TZ}
	volumes:
	  - /etc/localtime:/etc/localtime:ro
	  - /docker/appdata/config/bazarr:/config
	  - /path/to/data:/data
	restart: unless-stopped

  lidarr:
	image: lscr.io/linuxserver/lidarr:latest
	container_name: lidarr
	environment:
	  - PUID=${PUID}
	  - PGID=${PGID}
	  - TZ=${TZ}
	volumes:
	  - /docker/appdata/config/lidarr:/config
	  - /path/to/media:/data
	ports:
	  - '127.0.0.1:8686:8686'
	restart: unless-stopped

  prowlarr:
	image: lscr.io/linuxserver/prowlarr:latest
	container_name: prowlarr
	environment:
	  - PUID=${PUID}
	  - PGID=${PGID}
	  - TZ=${TZ}
	ports:
	  - '127.0.0.1:9696:9696'
	volumes:
	  - /docker/appdata/config/prowlarr:/config
	restart: unless-stopped

  seerr:
	image: ghcr.io/seerr-team/seerr:latest
	container_name: seerr
	environment:
	  - LOG_LEVEL=${LOG_LEVEL}
	  - TZ=${TZ}
	  - PORT=${PORT} // usually :5055
	ports:
	  - '127.0.0.1:5055:5055'
	volumes:
	  - /docker/appdata/config:/app/config
	healthcheck:
	  test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
	  start_period: 20s
	  timeout: 3s
	  interval: 15s
	  retries: 3
	restart: unless-stopped

  flaresolverr:
	image: ghcr.io/flaresolverr/flaresolverr:latest
	container_name: flaresolverr
	environment:
	  - LOG_LEVEL=${LOG_LEVEL}
	  - TZ=${TZ}
	restart: unless-stopped

  qbittorrent:
	image: lscr.io/linuxserver/qbittorrent:latest
	container_name: qbittorrent
	environment:
	  - PUID=${PUID}
	  - PGID=${PGID}
	  - TZ=${TZ}
	  - WEBUI_PORT=${WEBUI_PORT} // usually :8080
	volumes:
	  - /docker/appdata/config/qbittorrent:/config
	  - /path/to/media/downloads:/downloads // can also rename to /torrents
	ports:
	  - '127.0.0.1:8080:8080'
	  - '6881:6881'
	restart: unless-stopped
